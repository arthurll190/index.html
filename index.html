<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória com Ranking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #333; margin-bottom: 5px; }
    p.finalidade { color: #555; margin-bottom: 20px; text-align: center; }
    .controles { margin-bottom: 20px; display: flex; gap: 10px; }
    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background-color: #1d4ed8; }
    .tabuleiro {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      gap: 10px;
      margin-bottom: 20px;
    }
    .carta {
      width: 80px;
      height: 80px;
      background-color: #1e293b;
      color: transparent;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s;
    }
    .carta.virada, .carta.combinada {
      background-color: #ffffff;
      color: #000;
      border: 2px solid #2563eb;
      cursor: default;
    }
    .ranking {
      background: white;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 350px;
    }
    .ranking h2 { margin-top: 0; font-size: 18px; }
    ol { padding-left: 20px; margin: 0; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>

  <h1>Jogo da Memória</h1>
  <p class="finalidade">Finalidade: Exercitar a memória visual e competir pelo menor número de tentativas.</p>

  <div class="controles">
    <input type="text" id="nomeJogador" placeholder="Digite seu nome">
    <button onclick="iniciarJogo()">Novo Jogo</button>
  </div>

  <p>Tentativas: <strong id="tentativas">0</strong></p>
  <div class="tabuleiro" id="tabuleiro"></div>

  <div class="ranking">
    <h2>Top 5 Melhores Jogadores</h2>
    <ol id="listaRanking"><li>Carregando ranking...</li></ol>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://gstatic.com";

    // SUBSTITUA PELAS SUAS CREDENCIAIS DO FIREBASE
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_://firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_://appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const emojis = ["🚀", "🎮", "💻", "🔥", "⚡", "🎯", "🎲", "🏆"];
    let cartasViradas = [];
    let paresEncontrados = 0;
    let tentativas = 0;
    let bloqueado = false;

    window.iniciarJogo = function() {
      const nome = document.getElementById("nomeJogador").value.trim();
      if (!nome) {
        alert("Por favor, digite seu nome antes de jogar.");
        return;
      }

      const tabuleiro = document.getElementById("tabuleiro");
      tabuleiro.innerHTML = "";
      cartasViradas = [];
      paresEncontrados = 0;
      tentativas = 0;
      bloqueado = false;
      document.getElementById("tentativas").textContent = tentativas;

      const baralho = [...emojis, ...emojis].sort(() => Math.random() - 0.5);

      baralho.forEach((emoji) => {
        const carta = document.createElement("div");
        carta.classList.add("carta");
        carta.dataset.valor = emoji;
        carta.textContent = emoji;
        carta.onclick = () => virarCarta(carta);
        tabuleiro.appendChild(carta);
      });
    };

    function virarCarta(carta) {
      if (bloqueado || carta.classList.contains("virada") || carta.classList.contains("combinada")) return;

      carta.classList.add("virada");
      cartasViradas.push(carta);

      if (cartasViradas.length === 2) {
        tentativas++;
        document.getElementById("tentativas").textContent = tentativas;
        verificarPar();
      }
    }

    function verificarPar() {
      bloqueado = true;
      const [c1, c2] = cartasViradas;

      if (c1.dataset.valor === c2.dataset.valor) {
        c1.classList.add("combinada");
        c2.classList.add("combinada");
        cartasViradas = [];
        bloqueado = false;
        paresEncontrados++;

        if (paresEncontrados === emojis.length) {
          finalizarJogo();
        }
      } else {
        setTimeout(() => {
          c1.classList.remove("virada");
          c2.classList.remove("virada");
          cartasViradas = [];
          bloqueado = false;
        }, 800);
      }
    }

    async function finalizarJogo() {
      const nome = document.getElementById("nomeJogador").value.trim();
      alert(`Parabéns, ${nome}! Você venceu em ${tentativas} tentativas.`);

      await addDoc(collection(db, "ranking"), {
        nome: nome,
        tentativas: tentativas,
        data: new Date()
      });

      carregarRanking();
    }

    async function carregarRanking() {
      const lista = document.getElementById("listaRanking");
      lista.innerHTML = "";

      const q = query(collection(db, "ranking"), orderBy("tentativas", "asc"), limit(5));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        lista.innerHTML = "<li>Nenhuma pontuação registrada ainda.</li>";
        return;
      }

      snapshot.forEach((doc) => {
        const dados = doc.data();
        const item = document.createElement("li");
        item.textContent = `${dados.nome} - ${dados.tentativas} tentativas`;
        lista.appendChild(item);
      });
    }

    carregarRanking();
  </script>
</body>
</html>
